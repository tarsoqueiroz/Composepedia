version: "3.8"

volumes:
  n8nData:

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - n8nData:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE
      - TZ
      - N8N_BASIC_AUTH_USER
      - N8N_BASIC_AUTH_PASSWORD
      - N8N_SECURE_COOKIE
      - N8N_PROTOCOL
    restart: unless-stopped
